<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} — {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <style>
    body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }

    header {
      border-bottom: 1px solid #ddd;
      padding: 25px 0 15px;
      margin-bottom: 35px;
    }

    .site-title {
      font-size: 1.8rem;
      font-weight: 700;
      text-decoration: none;
      color: #222;
    }

    .site-description {
      margin: 3px 0 20px;
      color: #666;
    }

    nav a {
      margin-right: 18px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      margin-bottom: 50px;
    }

    footer {
      border-top: 1px solid #ddd;
      padding: 20px 0;
      margin-top: 50px;
      color: #777;
      font-size: 0.9rem;
    }

    h1, h2, h3 {
      line-height: 1.25;
    }

    pre {
      padding: 15px;
      overflow-x: auto;
      background: #f5f5f5;
      border-radius: 5px;
    }

    code {
      font-family: monospace;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin: 20px 0;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
    }

    th {
      background: #f5f5f5;
    }
  </style>
</head>

<body>

<header>
  <a class="site-title" href="{{ '/' | relative_url }}">
    {{ site.title }}
  </a>

  <div class="site-description">
    {{ site.description }}
  </div>

<!--  <nav>
    <a href="{{ '/' | relative_url }}">Accueil</a>
    <a href="{{ '/comprendre/' | relative_url }}">Comprendre</a>
    <a href="{{ '/referentiels/' | relative_url }}">Référentiels</a>
    <a href="{{ '/methodes/' | relative_url }}">Méthodes</a>
    <a href="{{ '/livrables/' | relative_url }}">Livrables</a>
    <a href="{{ '/correspondances/' | relative_url }}">Correspondances</a> 
  </nav>-->
  
  <nav>
  <a href="{{ '/' | relative_url }}">Accueil</a>

  {% assign nav_pages = site.pages
    | where: "nav", true
    | sort: "nav_order" %}

  {% for nav_page in nav_pages %}
    <a href="{{ nav_page.url | relative_url }}">
      {{ nav_page.title }}
    </a>
  {% endfor %}
</nav>
</header>

<main>
  {{ content }}
</main>

<footer>
  <strong>CyberRepères</strong> — Des références pour comprendre,
  des repères pour agir.
</footer>

</body>
</html>
